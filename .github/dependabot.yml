# Mises à jour proposées en PR (la CI et `composer audit` valident chacune avant merge).
version: 2
updates:
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - enhancement
    assignees:
      - ronan-develop
    commit-message:
      prefix: "🔧 chore(deps)"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - enhancement
    assignees:
      - ronan-develop
    commit-message:
      prefix: "🔧 chore(ci)"
