name: CI

on:
  push:
    branches: [main]
  pull_request:

# Jeton en lecture seule pour tous les travaux (#436) : aucun n'écrit dans le dépôt.
permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: rehearsalbox_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.4"
          coverage: pcov

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Audit dependencies
        run: composer audit

      - name: Static analysis (PHPStan)
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      - name: Code style (PSR-12)
        run: ./vendor/bin/php-cs-fixer fix --dry-run --diff --using-cache=no

      - name: Class size budget
        run: php bin/check-size.php

      - name: Classes per folder budget
        run: php bin/check-folders.php

      - name: Run PHPUnit
        env:
          DB_TEST_HOST: 127.0.0.1
          DB_TEST_PORT: "3306"
          DB_TEST_NAME: rehearsalbox_test
          DB_TEST_USER: root
          DB_TEST_PASSWORD: root
        run: ./vendor/bin/phpunit --colors=always --coverage-clover=build/coverage/clover.xml

      # Couverture (#129, #365) : résumé par dossier et par couche dans l'onglet « Summary » du run. BLOQUANT sous 90 % de couverture
      # totale (le seuil n'est écrit qu'ici). `shell: bash` active pipefail : sans lui, le code de sortie du script serait masqué par tee.
      - name: Coverage summary
        shell: bash
        run: php bin/coverage-summary.php --min=90 | tee -a "$GITHUB_STEP_SUMMARY"

  js:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit

      - name: Run JS tests
        run: npm test

  # Analyse de secrets (#422) : tout l'historique, valeurs masquées (--redact) dans le journal. L'image est épinglée par empreinte
  # (gitleaks v8.30.1) ; Dependabot ne la met pas à jour, la changer à la main avec le numéro de version.
  secrets:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Scan secrets (gitleaks)
        run: >-
          docker run --rm -v "$PWD":/repo:ro
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --exit-code 1
